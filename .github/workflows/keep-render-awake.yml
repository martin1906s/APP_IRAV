name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping IRAV API health
        run: |
          URL="${KEEP_ALIVE_URL:-https://back-irav.onrender.com}/health"
          echo "GET $URL"
          curl -fsS "$URL" || echo "Aviso: el servicio puede estar despertando (plan free)"
