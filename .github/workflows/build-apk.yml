name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_GEMINI_MODEL: ${{ vars.EXPO_PUBLIC_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://back-irav.onrender.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure environment variables
        run: |
          if [ -z "$EXPO_PUBLIC_GEMINI_API_KEY" ]; then
            echo "Falta el secreto EXPO_PUBLIC_GEMINI_API_KEY en GitHub Actions."
            exit 1
          fi

          API_URL="${EXPO_PUBLIC_API_URL:-https://back-irav.onrender.com}"
          API_URL="${API_URL%/}"

          echo "API de producción: $API_URL"
          curl -fsS "$API_URL/health" || echo "Aviso: /health no respondió (Render puede estar dormido; el build continúa)."

          cat > .env << EOF
          EXPO_PUBLIC_GEMINI_API_KEY=${EXPO_PUBLIC_GEMINI_API_KEY}
          EXPO_PUBLIC_GEMINI_MODEL=${EXPO_PUBLIC_GEMINI_MODEL}
          EXPO_PUBLIC_API_URL=${API_URL}
          EOF

          echo "Contenido de .env (sin claves):"
          grep -v GEMINI_API_KEY .env | sed 's/=.*/=***/'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64 en GitHub Actions."
            echo "Genera uno con: .\\scripts\\generate-android-keystore.ps1"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}
          MYAPP_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}
          android.enableMinifyInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS || 'irav-release' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build production APK
        working-directory: android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: ${{ vars.EXPO_PUBLIC_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://back-irav.onrender.com' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/IRAV-${{ github.sha }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk dist/IRAV-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: irav-apk-release
          path: dist/IRAV-latest.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IRAV v1.0.0 (#${{ github.run_number }})
          body: |
            APK de **producción** firmado, generado automáticamente desde la rama principal.

            **API:** ${{ vars.EXPO_PUBLIC_API_URL || 'https://back-irav.onrender.com' }}
            **Commit:** ${{ github.sha }}

            Descarga el APK desde los assets de esta release e instálalo en tu dispositivo.
          files: dist/IRAV-latest.apk
          draft: false
          prerelease: false
          make_latest: true
